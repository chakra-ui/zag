packages:
  - packages/**
  - shared
  - examples/**
  - website

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true

trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1

# Panda ships from the chakra-ui org, so new releases can land the same day
minimumReleaseAgeExclude:
  - "@pandacss/*"
