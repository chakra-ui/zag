name: Publish

on:
  push:
    paths:
      - ".changeset/**"
      - "packages/**"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  FORCE_COLOR: 2
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  HUSKY: 0

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SAGE_PAT }}

      - name: Install
        uses: ./.github/composite-actions/install

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          commit: "ci(changesets): version packages"
          commitMode: github-api
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Slack notification
        if: steps.changesets.outputs.published == 'true'
        run: pnpm slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # Safety net for tags changesets/action failed to create due to ref contention.
      # Compare by name: local tags are annotated, remote ones (github-api) are lightweight,
      # so `git push --tags` would reject every tag as "already exists".
      - name: Push tags (fallback)
        if: always() && steps.changesets.outcome != 'skipped'
        run: |
          remote_tags=$(git ls-remote --tags origin | sed 's|.*refs/tags/||; s|\^{}$||' | sort -u)
          missing=$(comm -23 <(git tag -l | sort -u) <(echo "$remote_tags"))

          if [ -z "$missing" ]; then
            echo "All local tags already exist on the remote"
            exit 0
          fi

          echo "Pushing missing tags:"
          echo "$missing"

          for i in 1 2 3 4 5; do
            echo "$missing" | xargs git push origin && exit 0
            echo "tag push failed (attempt $i), retrying in $((i*5))s..."
            sleep $((i*5))
          done
          exit 1
