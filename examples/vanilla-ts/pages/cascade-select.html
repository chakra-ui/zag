<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cascade Select</title>
  </head>
  <body style="padding: 40px">
    <a href="/">← Back to examples</a>
    <h1>Cascade Select</h1>

    <main class="cascade-select">
      <div class="cascade-select-root">
        <label class="cascade-select-label">Select a location</label>

        <div class="cascade-select-control">
          <button class="cascade-select-trigger">
            <span class="cascade-select-value-text">Select a location</span>
          </button>
          <div class="cascade-select-indicator-group">
            <button class="cascade-select-clear">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
            </button>
            <span class="cascade-select-indicator">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5" /><path d="m7 9 5-5 5 5" /></svg>
            </span>
          </div>
        </div>

        <input class="cascade-select-hidden-input" />

        <div class="cascade-select-positioner">
          <div class="cascade-select-content"></div>
        </div>
      </div>
    </main>

    <script type="module" src="./cascade-select.ts"></script>
  </body>
</html>
